aid: abacum
name: Abacum
description: >-
  Abacum is an AI-native financial planning and analysis (FP&A) platform built for
  CFOs and finance teams to connect financial data, automate planning and reporting,
  and align cross-functional teams. It unifies budgeting and forecasting, headcount
  and revenue planning, scenario modeling, investor and board reporting, and P&L /
  balance-sheet / cash-flow roll-ups, with 700+ prebuilt integrations across ERP and
  accounting systems (NetSuite, Sage Intacct, QuickBooks, Xero, Dynamics 365), HRIS
  and payroll (Workday, Rippling, BambooHR, Gusto, Deel), CRM (Salesforce, HubSpot),
  billing (Stripe, Chargebee, Maxio), and data warehouses (Snowflake, BigQuery,
  Databricks). An Excel connector and embedded workflows keep planning models and
  actuals in sync. Abacum surfaced in the API Evangelist network as a portfolio
  company of Creandum and Scale Venture Partners.
